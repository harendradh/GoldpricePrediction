# Project-level Databricks Asset Bundle.
# Every job generated by `dfx job add` drops a resources/<domain>/<job>.job.yml
# which is auto-included below — no bundle edits needed per job.
bundle:
  name: df-dbx-rt-ingestion-workflow

include:
  - resources/*/*.job.yml

variables:
  environment:
    description: Environment name matching conf/environments/<env>.yaml
    default: dev
  spark_version:
    description: Databricks runtime for streaming jobs
    default: 15.4.x-scala2.12
  node_type_id:
    description: Worker node type
    default: m6g.xlarge

artifacts:
  framework_wheel:
    type: whl
    path: .

sync:
  include:
    - conf/**
    - resources/**

targets:
  dev:
    default: true
    variables:
      environment: dev
  qa:
    variables:
      environment: qa
  prod:
    mode: production
    variables:
      environment: prod
